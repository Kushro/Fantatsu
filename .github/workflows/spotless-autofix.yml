name: Spotless Auto Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main  # Or any branch where you want this workflow to run

jobs:
  spotless-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create spotless-fixes branch (if not already on it)
        run: |
          git checkout -B spotless-fixes

      - name: Run spotlessApply
        run: ./gradlew spotlessApply

      - name: Commit changes (if any)
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore: Apply Spotless formatting"

      - name: Push changes to spotless-fixes
        run: |
          git push origin spotless-fixes
